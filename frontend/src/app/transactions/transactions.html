<section class="transactions-page">
  <div class="transactions-page__header">
    <h1>Transações</h1>
    <button type="button" [disabled]="syncing()" (click)="refresh()">
      {{ syncing() ? 'Sincronizando...' : 'Atualizar' }}
    </button>
  </div>

  @if (loading()) {
    <p>Carregando...</p>
  } @else if (errorMessage()) {
    <p class="transactions-page__error">{{ errorMessage() }}</p>
  } @else {
    <div class="filters">
      <input
        type="text"
        placeholder="Buscar por descrição..."
        [value]="search()"
        (input)="search.set($any($event.target).value)"
      />

      <app-multi-select
        allLabel="Todas as categorias"
        [options]="categoryOptions()"
        [selected]="categories()"
        (selectedChange)="categories.set($event)"
      />

      <app-multi-select
        allLabel="Todas as contas"
        [options]="institutionOptions()"
        [selected]="institutions()"
        (selectedChange)="institutions.set($event)"
      />

      <button type="button" (click)="clearFilters()">Limpar filtros</button>
    </div>

    <div class="date-presets">
      <button
        type="button"
        class="date-presets__chip"
        [class.date-presets__chip--active]="activePreset() === 'all'"
        (click)="applyPreset('all')"
      >
        Tudo
      </button>
      <button
        type="button"
        class="date-presets__chip"
        [class.date-presets__chip--active]="activePreset() === '7d'"
        (click)="applyPreset('7d')"
      >
        Últimos 7 dias
      </button>
      <button
        type="button"
        class="date-presets__chip"
        [class.date-presets__chip--active]="activePreset() === '30d'"
        (click)="applyPreset('30d')"
      >
        Últimos 30 dias
      </button>
      <button
        type="button"
        class="date-presets__chip"
        [class.date-presets__chip--active]="activePreset() === 'current-month'"
        (click)="applyPreset('current-month')"
      >
        Mês atual
      </button>
      <button
        type="button"
        class="date-presets__chip"
        [class.date-presets__chip--active]="activePreset() === 'previous-month'"
        (click)="applyPreset('previous-month')"
      >
        Mês anterior
      </button>

      <input
        type="date"
        [value]="dateFrom()"
        (change)="setDateFrom($any($event.target).value)"
      />
      <span class="date-presets__separator">até</span>
      <input type="date" [value]="dateTo()" (change)="setDateTo($any($event.target).value)" />
    </div>

    <p class="transactions-page__count">
      {{ filteredTransactions().length }} de {{ transactions().length }} transações
    </p>

    <app-transaction-table [transactions]="filteredTransactions()" [showInstitution]="true" />
  }
</section>
