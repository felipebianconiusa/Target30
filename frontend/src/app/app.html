@if (!authService.checkedSession()) {
  <div class="shell shell--centered">
    <p>Carregando...</p>
  </div>
} @else if (!authService.user()) {
  <div class="shell shell--centered login-screen">
    <h1>Target30</h1>
    <p>Suas contas e cartões, num só lugar.</p>
    <app-google-login-button />
  </div>
} @else {
  <div class="shell">
    <header class="shell__header">
      <h1>Target30</h1>
      <nav class="shell__nav">
        <a
          routerLink="/"
          routerLinkActive="shell__nav-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Dashboard
        </a>
        <a routerLink="/accounts" routerLinkActive="shell__nav-link--active">Contas</a>
        <a routerLink="/transactions" routerLinkActive="shell__nav-link--active">Transações</a>
      </nav>
      <div class="shell__user">
        @if (authService.user()?.picture) {
          <img class="shell__avatar" [src]="authService.user()?.picture" alt="" />
        }
        <span>{{ authService.user()?.name ?? authService.user()?.email }}</span>
        <button type="button" class="shell__logout" (click)="authService.logout()">Sair</button>
      </div>
    </header>
    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
}
