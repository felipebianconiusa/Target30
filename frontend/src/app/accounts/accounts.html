<section class="accounts">
  <h1>Contas</h1>

  <app-connect-account (connected)="loadItems()" />

  @if (items().length > 0) {
    <div class="accounts__list">
      <h2>Contas conectadas</h2>
      <ul>
        @for (item of items(); track item.itemId) {
          <li class="accounts__row">
            <span>{{ item.institutionName ?? 'Instituição sem nome' }}</span>
            <a
              [routerLink]="['/transactions']"
              [queryParams]="{ institution: item.institutionName }"
            >
              ver transações →
            </a>
          </li>
        }
      </ul>
    </div>
  }
</section>
