<section class="connect">
  @switch (status()) {
    @case ('connected') {
      <p class="connect__success">
        {{ 'accounts.connectedSuccess' | translate: { institution: institutionName() } }}
      </p>
    }
    @default {
      <p class="connect__hint">{{ 'accounts.connectHint' | translate }}</p>
      <button
        class="connect__button"
        type="button"
        [disabled]="status() === 'loading'"
        (click)="connect()"
      >
        {{ (status() === 'loading' ? 'accounts.opening' : 'accounts.connectButton') | translate }}
      </button>
      @if (status() === 'error') {
        <p class="connect__error">{{ errorMessage() }}</p>
      }
    }
  }
</section>
